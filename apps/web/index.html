<!doctype html>
<!-- Kannada-first: the default language of the public site. React keeps
     this in step with the visitor's choice from SiteProvider. -->
<html lang="kn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="RK Campaign Intelligence Platform - public engagement and campaign management."
    />
    <title>RK Campaign Intelligence Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking font load for 2G: print media + swap keeps first paint
      readable on system fonts, then upgrades. Only 400 + 600 (body + emphasis)
      — 500/700 were rarely distinct enough to justify the bytes.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
